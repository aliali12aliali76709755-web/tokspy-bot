<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوت معلومات تيك توك TikTok information</title>
    <meta name="description" content="بوت معلومات تيك توك TikTok information - أقوى بوت لتحليل حسابات تيك توك وتحميل الفيديوهات بدون علامة مائية">
    <meta property="og:title" content="بوت معلومات تيك توك TikTok information">
    <meta property="og:description" content="اضغط للدخول المباشر إلى البوت في تيليجرام وبدء الاستخدام">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#0d0f12">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", "Tahoma", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: radial-gradient(circle at top, #161b22, #090c10 85%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }
        .card {
            background: rgba(22, 27, 34, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 40px 28px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 35px rgba(0, 242, 254, 0.15);
            animation: fadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(24px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .bot-avatar {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.55);
            position: relative;
        }
        .verified-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: #2AABEE;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #090c10;
        }
        .verified-badge svg {
            width: 14px;
            height: 14px;
            fill: #ffffff;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.4;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #ffffff, #e5e7eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bot-en {
            font-size: 15px;
            color: #00f2fe;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 22px;
            direction: ltr;
        }
        .features {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 28px;
            text-align: right;
        }
        .feature-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #d1d5db;
        }
        .feature-icon {
            font-size: 20px;
        }
        .btn-launch {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 17px 24px;
            background: linear-gradient(135deg, #2AABEE 0%, #229ED9 100%);
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(42, 171, 238, 0.45);
            transition: all 0.25s ease;
            cursor: pointer;
            border: none;
            outline: none;
        }
        .btn-launch:hover, .btn-launch:active {
            transform: translateY(-2px);
            box-shadow: 0 14px 35px rgba(42, 171, 238, 0.65);
            filter: brightness(1.08);
        }
        .redirect-notice {
            margin-top: 18px;
            font-size: 12px;
            color: #9ca3af;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #00f2fe;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .footer-stats {
            margin-top: 24px;
            font-size: 12px;
            color: #6b7280;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="bot-avatar">
            ⚡
            <div class="verified-badge">
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
            </div>
        </div>

        <h1>بوت معلومات تيك توك</h1>
        <div class="bot-en">TikTok information Bot</div>

        <div class="features">
            <div class="feature-item">
                <span class="feature-icon">🔍</span>
                <span>كشف معلومات وإحصائيات الحسابات بدقة</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">📥</span>
                <span>تحميل فيديو تيك توك بدون علامة مائية HD</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">👁️</span>
                <span>مراقبة الحسابات والتنبيهات المباشرة 24/7</span>
            </div>
        </div>

        <a id="btnLaunch" href="https://t.me/TokSpy3Bot?start=web" class="btn-launch">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
            </svg>
            <span>دخول البوت وبدء الاستخدام</span>
        </a>

        <div class="redirect-notice">
            <div class="spinner"></div>
            <span>جاري التحويل تلقائياً إلى تيليجرام...</span>
        </div>

        <div class="footer-stats">
            المنصة الرسمية المعتمدة لخدمات وأدوات تيك توك
        </div>
    </div>

    <script>
        // Extract start parameter from URL if any
        const urlParams = new URLSearchParams(window.location.search);
        const ref = urlParams.get('ref') || 'direct';
        const startParam = 'web_' + ref.replace(/[^a-zA-Z0-9_]/g, '');

        const tgProtocolUrl = 'tg://resolve?domain=TokSpy3Bot&start=' + startParam;
        const tgWebUrl = 'https://t.me/TokSpy3Bot?start=' + startParam;

        const btn = document.getElementById('btnLaunch');
        btn.href = tgWebUrl;

        function recordClick() {
            try {
                if (navigator.sendBeacon) {
                    navigator.sendBeacon('/click?ref=' + encodeURIComponent(ref));
                } else {
                    fetch('/click?ref=' + encodeURIComponent(ref), { method: 'POST', mode: 'no-cors' });
                }
            } catch(e) {}
        }

        // Auto-redirect to Telegram app protocol after 350ms
        setTimeout(function() {
            recordClick();
            window.location.href = tgProtocolUrl;
        }, 350);

        // Clicking button also records click and fallbacks to web URL
        btn.addEventListener('click', function(e) {
            recordClick();
            setTimeout(function() {
                window.location.href = tgWebUrl;
            }, 500);
        });
    </script>
</body>
</html>
