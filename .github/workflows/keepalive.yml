name: Render 24/7 Keep-Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Server
        run: |
          curl -s -f -m 30 "https://tokspy-telegram-bot-ov5o.onrender.com/health" || true
          curl -s -f -m 30 "https://tokspy-telegram-bot-ov5o.onrender.com/" || true
